<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Code Editor</title>
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="logo.png" type="image/x-icon">
</head>
<body>
    <header>
        <h1>Online Code Editor</h1>
        <a href="https://tejashande.shop">Created By Tejas</a>
    </header>
    <main class="container">
        <section class="editor">
            <div class="editor-card">
                <div class="card-header html-header">
                    <h2>HTML</h2>
                </div>
                <div class="card-body">
                    <textarea id="html-code" class="code-editor" placeholder="Enter HTML code here"></textarea>
                </div>
            </div>
            <div class="editor-card">
                <div class="card-header css-header">
                    <h2>CSS</h2>
                </div>
                <div class="card-body">
                    <textarea id="css-code" class="code-editor" placeholder="Enter CSS code here"></textarea>
                </div>
            </div>
            <div class="editor-card">
                <div class="card-header js-header">
                    <h2>JavaScript</h2>
                </div>
                <div class="card-body">
                    <textarea id="js-code" class="code-editor" placeholder="Enter JavaScript code here"></textarea>
                </div>
            </div>
        </section>
        <section class="output-section">
            <div class="card">
                <div class="card-header output-header">
                    <h2>Output</h2>
                    <button id="fullscreen-toggle" class="fullscreen-btn">
                        <span class="expand-icon">⤢</span>
                        <span class="collapse-icon">⤡</span>
                    </button>
                </div>
                <div class="card-body">
                    <iframe id="output" class="output-frame"></iframe>
                </div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
